<div class="container mt-4">
  <div class="card mb-4">
    <div class="card-body">

      <h4 class="mb-1">{{ user.username }}</h4>
      <p class="text-muted mb-3">{{ user.email }}</p>

      <div class="d-flex gap-5">
        <div>
          <strong>{{ user.posts }}</strong>
          <div class="text-muted">Posts</div>
        </div>

        <div>
          <strong>{{ user.followers }}</strong>
          <div class="text-muted">Followers</div>
        </div>

        <div>
          <strong>{{ user.following }}</strong>
          <div class="text-muted">Following</div>
        </div>
      </div>

    </div>
  </div>

  <h5 class="mb-3">People</h5>

  <div *ngIf="users.length === 0" class="text-muted">
    No users to show
  </div>

  <div class="list-group">
    <div class="list-group-item d-flex justify-content-between align-items-center" *ngFor="let u of users">

      <span>{{ u.username }}</span>
      <button  *ngIf="!u.isFollowing" class="btn btn-sm btn-primary"  (click)="follow(u)">  Follow</button>
      <button *ngIf="u.isFollowing" class="btn btn-sm btn-outline-secondary" (click)="unfollow(u)"> Following</button>
    </div></div>
</div>
